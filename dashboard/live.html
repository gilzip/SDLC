<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח זרימת פיתוח</title>
<style>
:root{
  --bg:#f3f6f9; --surface:#fff; --ink:#14202b; --muted:#5a6978; --line:#d6dee6; --accent:#2556d9;
  --todo:#f4b4b4; --todo-ink:#7a1c1c; --run:#a9e6f2; --run-ink:#0b4a5a; --done:#a6e3bf; --done-ink:#0f5a35;
  --pip-off:rgba(0,0,0,.14); --pip-on:rgba(0,0,0,.55);
  --font:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e141a; --surface:#151d25; --ink:#e6ecf2; --muted:#92a1b0; --line:#2a3846; --accent:#7ba3ff;
    --todo:#6b2a2a; --todo-ink:#ffd6d6; --run:#0f5566; --run-ink:#d3f6ff; --done:#17603b; --done-ink:#d6f7e5;
    --pip-off:rgba(255,255,255,.2); --pip-on:rgba(255,255,255,.85); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px}
h1{margin:0;font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#b42323;border-color:#e2a9a9}
button:disabled{opacity:.45;cursor:default}
main{padding:0 20px 28px;overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
th{font-weight:600;font-size:14px;padding:8px 6px;text-align:center;vertical-align:bottom}
th.rowh{text-align:start;white-space:nowrap;min-width:130px}
th .ed{opacity:.5;border:0;background:none;padding:0 4px;font-size:13px}
th .ed:hover{opacity:1}
.banner{margin:0 20px 10px;padding:10px 14px;border-radius:10px;background:#fdf0d5;color:#6b4300;border:1px solid #e8b24a;font-size:14px}
.banner[hidden]{display:none}
td{padding:0}
.c.dim{opacity:.25}
#who-filter{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.stages .own{font:inherit;font-size:13px;padding:3px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:170px}
th.e2eh{border-inline-start:2px solid var(--line);padding-inline-start:12px}
td.e2ec{padding-inline-start:6px;border-inline-start:2px solid var(--line)}
.stages select{font:inherit;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.c{display:block;width:100%;min-height:68px;border-radius:10px;border:0;padding:8px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.c.todo{background:var(--todo);color:var(--todo-ink)}
.c.run{background:var(--run);color:var(--run-ink)}
.c.done{background:var(--done);color:var(--done-ink)}
.c:hover{filter:brightness(.96);outline:2px solid var(--accent)}
.c .lbl{font-size:13px;font-weight:600}
.c .sub{font-size:12px;opacity:.85}
.pips{display:flex;gap:3px;direction:ltr}
.pips b{width:18px;height:6px;border-radius:3px;background:var(--pip-off)}
.pips b.on{background:var(--pip-on)}
.pips b.cur{background:var(--pip-on);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.na{display:block;min-height:68px;border-radius:10px;border:1px dashed var(--line);
  background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(120,130,140,.08) 8px 16px)}
.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.bar{align-items:flex-end;gap:18px}
.bar .grp{display:flex;flex-direction:column;gap:4px}
.bar .gl{font-size:12px;color:var(--muted)}
.bar .btns{display:flex;gap:8px}
#dEmps{width:min(780px,96vw)}
#dAssignM,#dAssignE{width:min(980px,96vw)}
.scroll{overflow:auto;max-height:55vh;margin-top:12px}
table.grid{border-collapse:collapse;width:100%}
table.grid th,table.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;font-weight:500}
table.grid thead th{position:sticky;top:0;background:var(--surface)}
table.grid tbody th{text-align:start;white-space:nowrap}
table.grid select{font:inherit;font-size:13px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:130px}
table.grid input[type=checkbox]{width:18px;height:18px}
.row.emp input{min-width:0}
dialog h2{margin:0 0 4px;font-size:18px}
.muted{color:var(--muted);font-size:13px}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input{flex:1}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.stages{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.stages li{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.stages li.run{background:var(--run);color:var(--run-ink);border-color:transparent}
.stages .hint{font-size:12px;font-weight:400;opacity:.85}
.stages li.done{background:var(--done);color:var(--done-ink);border-color:transparent}
.stages .n{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.12);display:grid;place-items:center;font-size:13px;font-weight:700}
.stages .st{margin-inline-start:auto;font-size:13px}
.log{max-height:130px;overflow:auto;font-size:13px;color:var(--muted);margin:10px 0 0;padding:0;list-style:none}
.log li{padding:2px 0}
.err{color:#b42323;font-size:13px;min-height:18px}
</style>
</head>
<body>
<header>
  <div>
    <h1>לוח זרימת פיתוח</h1>
    <div class="legend">
      <span><i style="background:var(--todo)"></i>לא התחיל</span>
      <span><i style="background:var(--run)"></i>בתהליך עבודה</span>
      <span><i style="background:var(--done)"></i>הסתיים</span>
      <span id="flow"></span>
    </div>
  </div>
  <div class="bar">
    <div class="grp"><span class="gl">רשימות (הוספה, עריכה, מחיקה)</span>
      <span class="btns"><button id="manageProjects">פרויקטים</button><button id="manageModules">תת מודולים</button>
        <select id="who-filter" title="עובדים: בחר עובד כדי להדגיש את המשימות שממתינות לו, או בחר ניהול עובדים"><option value="">עובדים</option></select></span>
    </div>
    <div class="grp"><span class="gl">שיוך</span>
      <span class="btns"><button id="assignModules">תת מודולים לפרויקטים</button><button id="assignEmps">עובדים לפרויקטים</button></span>
    </div>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main><div id="matrix"></div></main>

<dialog id="dCell"></dialog>
<dialog id="dE2E"></dialog>
<dialog id="dProject"></dialog>
<dialog id="dModules"></dialog>
<dialog id="dProjects"></dialog>
<dialog id="dEmps"></dialog>
<dialog id="dAssignM"></dialog>
<dialog id="dAssignE"></dialog>

<script>
let S = null, lastJson = '';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATE_HE = {pend:'ממתין', run:'בעבודה', done:'הסתיים'};

async function api(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || 'שגיאה'); }
  await refresh(true);
}

function showBanner(msg) {
  const b = $('banner'); b.textContent = msg; b.hidden = !msg;
}

async function refresh(force) {
  try {
    const r = await fetch('/api/state');
    const t = await r.text();
    if (!r.ok) { showBanner((JSON.parse(t || '{}').error) || 'השרת לא זמין'); return; }
    showBanner('');
    if (!force && t === lastJson) return;
    lastJson = t; S = JSON.parse(t); render();
  } catch (e) { showBanner('אין חיבור לשרת'); }
}

const empName = key => S.employees.some(e => e.name === key) ? key : '';  // owners are stored by employee name
const roleName = key => (S.roles.find(r => r.key === key) || {}).name || key;

function cellInfo(c) {
  const st = c.stages;
  let cur = st.findIndex(s => s === 'run');
  if (c.status === 'todo') return {lbl:'לא התחיל', sub:'', cur:-1};
  if (c.status === 'done') return {lbl:'הסתיים', sub:'נבדק קצה לקצה', cur:-1};
  return {lbl:S.stages[cur].name, sub:empName(c.owners[cur]) || 'ללא אחראי', cur};
}

/* employee filter in the header: dims every task that is not currently waiting on that employee */
let filterEmail = '';
// one "עובדים" control: pick an employee to highlight their tasks, "הצג הכול" to clear, "ניהול עובדים" to edit the list
$('who-filter').onchange = e => {
  if (e.target.value === '__manage') { e.target.value = filterEmail; renderEmps(); $('dEmps').showModal(); return; }
  filterEmail = e.target.value; render();
};
function renderFilter() {
  const sel = $('who-filter');
  sel.innerHTML = '<option value="">עובדים: הצג הכול</option>' +
    S.employees.map(e => `<option value="${esc(e.name)}">${esc(e.name)} (${esc(roleName(e.role))})</option>`).join('') +
    '<option value="__manage">ניהול עובדים…</option>';
  if (!S.employees.some(e => e.name === filterEmail)) filterEmail = '';
  sel.value = filterEmail;
}

function render() {
  $('flow').textContent = 'זרימה: ' + S.stages.map(s => s.name).join(' ← ');
  renderFilter();
  if (!S.projects.length) { $('matrix').innerHTML = '<div class="empty">אין פרויקטים. הוסף פרויקט להתחלה.</div>'; renderOpen(); return; }
  let h = '<table><thead><tr><th></th>';
  for (const m of S.modules) h += `<th>${esc(m.name)}</th>`;
  h += '<th class="e2eh">בדיקה קצה לקצה<br>ואישור לפרודקשיין</th></tr></thead><tbody>';
  for (const p of S.projects) {
    h += `<tr><th class="rowh">${esc(p.name)} <button class="ed" data-p="${p.id}" title="עריכת פרויקט">✎</button></th>`;
    for (const m of S.modules) {
      const c = S.cells[p.id + ':' + m.id];
      if (!c) { h += '<td><span class="na" title="לא משויך"></span></td>'; continue; }
      const i = cellInfo(c);
      const pips = c.stages.map((s, k) => `<b class="${s==='done'?'on':s==='run'?'cur':''}"></b>`).join('');
      const dim = filterEmail && !(i.cur >= 0 && c.owners[i.cur] === filterEmail) ? ' dim' : '';
      h += `<td><button class="c ${c.status}${dim}" data-p="${p.id}" data-m="${m.id}"><span class="lbl">${esc(i.lbl)}</span><span class="pips">${pips}</span><span class="sub">${esc(i.sub)}</span></button></td>`;
    }
    if (p.e2e === 'na') h += '<td class="e2ec"><span class="na" title="אין תתי מודולים"></span></td>';
    else {
      const t = {todo:['ממתין לסיום תתי המודולים', `${p.done}/${p.total}`], run:['ממתין לבדיקה קצה לקצה', `${p.total}/${p.total} הסתיימו`], done:['מאושר לפרודקשיין', 'נבדק קצה לקצה']}[p.e2e];
      const dimE = filterEmail && !(p.e2e === 'run' && p.owners.qa === filterEmail) ? ' dim' : '';
      h += `<td class="e2ec"><button class="c ${p.e2e}${dimE}" data-e="${p.id}"><span class="lbl">${t[0]}</span><span class="sub">${t[1]}</span></button></td>`;
    }
    h += '</tr>';
  }
  $('matrix').innerHTML = h + '</tbody></table>';
  renderOpen();
}

$('matrix').addEventListener('click', e => {
  const pe = e.target.closest('[data-e]'); if (pe) return openE2E(pe.dataset.e);
  const c = e.target.closest('.c'); if (c) return openCell(c.dataset.p, c.dataset.m);
  const ed = e.target.closest('.ed'); if (ed) openProject(ed.dataset.p);
});

/* ---------- cell detail ---------- */
let openKey = null, openSig = '';
function openCell(pid, mid) { openKey = [pid, mid]; openSig = ''; renderCell(); if (!$('dCell').open) $('dCell').showModal(); }
function renderOpen() { if ($('dCell').open) renderCell(); if ($('dE2E').open) renderE2E(); }
function renderCell() {
  const [pid, mid] = openKey;
  const p = S.projects.find(x => x.id === pid), m = S.modules.find(x => x.id === mid), c = S.cells[pid + ':' + mid];
  if (!p || !m || !c) { $('dCell').close(); return; }
  const sig = JSON.stringify([c, S.employees]); if (sig === openSig) return; openSig = sig;
  const curStage = c.stages.findIndex(s => s === 'run');
  const who = (curStage >= 0 && empName(c.owners[curStage])) || localStorage.getItem('who') || '';
  const note = $('note') ? $('note').value : '';
  let h = `<h2>${esc(p.name)} · ${esc(m.name)}</h2><div class="muted">כל שלב נסגר ידנית על ידי בעל התפקיד, ורק אז התא עובר לשלב הבא. אפשר להחזיר לשלב הקודם עם הערה.</div><ul class="stages">`;
  c.stages.forEach((s, k) => {
    let act = '';
    if (s === 'run') {
      act = `<button class="primary" data-a="complete" data-k="${k}">${esc(S.stages[k].done_label)}</button>`;
      if (k > 0) act += `<button class="danger" data-a="back" data-k="${k}">החזר ל${esc(S.stages[k-1].name)}</button>`;
    }
    h += `<li class="${s}"><span class="n">${k+1}</span><span><b>${esc(S.stages[k].name)}</b>${s==='run' ? `<div class="hint">${esc(S.stages[k].hint)}</div>` : ''}</span><span class="st">${STATE_HE[s]}</span>${ownerSelect(S.stages[k].role, c.owners[k], k)}${act}</li>`;
  });
  h += '</ul>';
  h += `<label for="who">שם בעל התפקיד</label><input type="text" id="who" value="${esc(who)}" placeholder="למשל: דנה, מנהלת מוצר">`;
  h += `<label for="note">הערה (נדרשת בהחזרה לשלב הקודם)</label><input type="text" id="note" value="${esc(note)}">`;
  h += '<div class="err" id="cerr"></div>';
  h += '<ul class="log">' + c.log.slice(0, 12).map(l => `<li>${new Date(l.ts*1000).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})} · ${esc(l.m)}</li>`).join('') + '</ul>';
  h += '<div class="foot"><span>';
  if (c.status === 'todo') h += '<button class="primary" data-a="start">התחל זרם</button>';
  else h += '<button class="danger" data-a="reset">אפס זרם</button>';
  h += '</span><button data-close>סגור</button></div>';
  $('dCell').innerHTML = h;
}
/* employee picker: people with the stage's role first, everyone else under "other" */
function ownerSelect(role, current, k) {
  const opt = e => `<option value="${esc(e.name)}" ${e.name === current ? 'selected' : ''}>${esc(e.name)}</option>`;
  const mine = S.employees.filter(e => e.role === role), rest = S.employees.filter(e => e.role !== role);
  return `<select class="own" data-k="${k}" title="אחראי: ${esc(roleName(role))}"><option value="">ללא אחראי (${esc(roleName(role))})</option>` +
    mine.map(opt).join('') + (rest.length ? `<optgroup label="תפקידים אחרים">${rest.map(opt).join('')}</optgroup>` : '') + '</select>';
}
$('dCell').addEventListener('change', async e => {
  const s = e.target.closest('select.own'); if (!s) return;
  try { await api('/api/cell/assign', {project:openKey[0], module:openKey[1], stage:+s.dataset.k, employee:s.value}); }
  catch (er) { $('cerr').textContent = er.message; }
});
$('dCell').addEventListener('click', async e => {
  if (e.target.closest('[data-close]')) return $('dCell').close();
  const b = e.target.closest('[data-a]'); if (!b) return;
  const who = $('who').value.trim(), note = $('note').value.trim();
  localStorage.setItem('who', who);
  if (b.dataset.a === 'back' && !note) { $('cerr').textContent = 'יש לכתוב הערה להחזרה לשלב הקודם'; return; }
  try {
    await api('/api/cell', {project:openKey[0], module:openKey[1], action:b.dataset.a, stage:+(b.dataset.k||0), who, note});
    if ($('note')) $('note').value = '';
  } catch (er) { $('cerr').textContent = er.message; }
});
$('dCell').addEventListener('close', () => { openKey = null; });

/* ---------- project-level end-to-end check ---------- */
let e2eId = null, e2eSig = '';
function openE2E(pid) { e2eId = pid; e2eSig = ''; renderE2E(); if (!$('dE2E').open) $('dE2E').showModal(); }
function renderE2E() {
  const p = S.projects.find(x => x.id === e2eId);
  if (!p) { $('dE2E').close(); return; }
  const mods = S.modules.filter(m => p.modules.includes(m.id));
  const sig = JSON.stringify([p, S.employees, mods.map(m => S.cells[p.id + ':' + m.id].stages)]); if (sig === e2eSig) return; e2eSig = sig;
  const who = $('ewho') ? $('ewho').value : (empName(p.owners.qa) || localStorage.getItem('who') || ''), note = $('enote') ? $('enote').value : '';
  let h = `<h2>${esc(p.name)} · בדיקה קצה לקצה לפרויקט</h2><div class="muted">נפתחת רק אחרי שכל תתי המודולים של הפרויקט סיימו את כל שלביהם, כולל הבדיקה קצה לקצה שלהם. האישור ידני. אם נמצאה תקלה, פתח מחדש את תת המודול הרלוונטי בשלב המתאים.</div><ul class="stages">`;
  for (const m of mods) {
    const c = S.cells[p.id + ':' + m.id];
    h += `<li class="${c.status==='done'?'done':c.status==='run'?'run':''}" data-m="${m.id}"><span class="n">${c.stages.filter(s=>s==='done').length}</span><b>${esc(m.name)}</b><span class="st">${c.status==='done'?'הסתיים':c.status==='run'?'בעבודה':'לא התחיל'}</span>`;
    if (c.status === 'done') h += `<select>${S.stages.map((s,k)=>`<option value="${k}">${esc(s.name)}</option>`).join('')}</select><button class="danger" data-reopen>פתח מחדש</button>`;
    h += '</li>';
  }
  h += '</ul>';
  if (!mods.length) h += '<div class="muted">אין תתי מודולים משויכים לפרויקט.</div>';
  h += `<div class="muted" style="margin-top:10px">אחראי לבדיקה (QA): ${esc(empName(p.owners.qa) || 'לא הוגדר. הגדר בעריכת הפרויקט')}</div>`;
  h += `<label for="ewho">שם המאשר</label><input type="text" id="ewho" value="${esc(who)}">`;
  h += `<label for="enote">הערה (נדרשת בפתיחה מחדש)</label><input type="text" id="enote" value="${esc(note)}"><div class="err" id="eerr"></div>`;
  h += `<ul class="log">${p.log.map(l => `<li>${new Date(l.ts*1000).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${esc(l.m)}</li>`).join('')}</ul>`;
  h += '<div class="foot"><span>';
  if (p.e2e === 'run') h += '<button class="primary" data-e2e>הפרויקט נבדק ותקין קצה לקצה, אשר לפרודקשיין</button>';
  else if (p.e2e === 'done') h += `<span class="muted">מאושר להעלאה לפרודקשיין${p.e2e_by ? ', אושר על ידי ' + esc(p.e2e_by) : ''}</span>`;
  else h += `<span class="muted">ממתין לסיום תתי המודולים (${p.done}/${p.total})</span>`;
  h += '</span><button data-close>סגור</button></div>';
  $('dE2E').innerHTML = h;
}
$('dE2E').addEventListener('click', async e => {
  if (e.target.closest('[data-close]')) return $('dE2E').close();
  const who = $('ewho').value.trim(); localStorage.setItem('who', who);
  try {
    if (e.target.closest('[data-e2e]')) await api('/api/project/e2e', {id:e2eId, who});
    const ro = e.target.closest('[data-reopen]');
    if (ro) {
      const note = $('enote').value.trim(); if (!note) { $('eerr').textContent = 'יש לכתוב הערה לפתיחה מחדש'; return; }
      const li = ro.closest('li');
      await api('/api/cell', {project:e2eId, module:li.dataset.m, action:'reopen', stage:+li.querySelector('select').value, who, note});
      $('enote').value = '';
    }
  } catch (er) { $('eerr').textContent = er.message; }
});
$('dE2E').addEventListener('close', () => { e2eId = null; });

/* ---------- project add / edit: the project itself is only a name ---------- */
$('manageProjects').onclick = () => { renderProjects(); $('dProjects').showModal(); };
function renderProjects(err, keep) {
  let h = '<h2>פרויקטים</h2><div class="muted">רשימת הפרויקטים. שינוי שם מתעדכן בכל מקום. מחיקת פרויקט מוחקת את כל הזרמים שלו. תתי המודולים והעובדים משויכים בנפרד במסכים "שיוך תת מודולים" ו"שיוך עובדים".</div>';
  for (const p of S.projects) h += `<div class="row" data-id="${p.id}"><input type="text" value="${esc(p.name)}" aria-label="שם הפרויקט"><button data-save>שמור</button><button class="danger" data-del>מחק</button></div>`;
  if (!S.projects.length) h += '<div class="muted" style="margin-top:10px">אין פרויקטים. הוסף למטה.</div>';
  h += `<label for="npn">פרויקט חדש</label><div class="row"><input type="text" id="npn" placeholder="שם" value="${esc(keep || '')}"><button class="primary" id="padd">הוסף</button></div>`;
  h += `<div class="err" id="pmerr">${esc(err || '')}</div><div class="foot"><span></span><button data-close>סגור</button></div>`;
  $('dProjects').innerHTML = h;
}
$('dProjects').addEventListener('click', async e => {
  const d = $('dProjects'), row = e.target.closest('.row[data-id]');
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'padd') { const n = $('npn').value.trim(); if (!n) return; await api('/api/project', {name:n}); renderProjects(); }
    else if (row && e.target.matches('[data-save]')) {
      const n = row.querySelector('input').value.trim(); if (!n) throw new Error('יש להזין שם');
      await api('/api/project/update', {id:row.dataset.id, name:n}); renderProjects();
    } else if (row && e.target.matches('[data-del]')) {
      if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'בטוח?'; return; }
      await api('/api/project/delete', {id:row.dataset.id}); renderProjects();
    }
  } catch (er) { renderProjects(er.message); }
});

function openProject(pid) {
  const p = pid ? S.projects.find(x => x.id === pid) : {name:''};
  let h = `<h2>${pid ? 'עריכת פרויקט' : 'פרויקט חדש'}</h2>`;
  h += `<label for="pn">שם הפרויקט</label><input type="text" id="pn" value="${esc(p.name)}">`;
  h += '<div class="muted" style="margin-top:10px">תתי המודולים והעובדים של הפרויקט משויכים במסכים "שיוך תת מודולים" ו"שיוך עובדים".</div>';
  h += '<div class="err" id="perr"></div><div class="foot"><span>';
  if (pid) h += '<button class="danger" id="pdel">מחק פרויקט</button>';
  h += '</span><span><button data-close>ביטול</button> <button class="primary" id="psave">שמור</button></span></div>';
  const d = $('dProject'); d.innerHTML = h; d.dataset.pid = pid || ''; d.showModal();
}
$('dProject').addEventListener('click', async e => {
  const d = $('dProject'), pid = d.dataset.pid;
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'psave') {
      const name = $('pn').value.trim(); if (!name) { $('perr').textContent = 'יש להזין שם'; return; }
      if (pid) await api('/api/project/update', {id:pid, name}); else await api('/api/project', {name});
      d.close();
    }
    if (e.target.id === 'pdel') {
      if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'לחץ שוב למחיקה סופית'; return; }
      await api('/api/project/delete', {id:pid}); d.close();
    }
  } catch (er) { $('perr').textContent = er.message; }
});

/* ---------- assignment screens: sub-modules to projects, employees to projects ---------- */
$('assignModules').onclick = () => { renderAssignModules(); $('dAssignM').showModal(); };
function renderAssignModules(err) {
  let h = '<h2>שיוך תת מודולים לפרויקטים</h2><div class="muted">סמן אילו תתי מודולים שייכים לכל פרויקט. אפשר לשייך לפרויקט רק חלק מהם. הסרת שיוך מוחקת את מצב הזרם של אותו תא.</div>';
  h += '<div class="scroll"><table class="grid"><thead><tr><th></th>' + S.modules.map(m => `<th>${esc(m.name)}</th>`).join('') + '</tr></thead><tbody>';
  for (const p of S.projects)
    h += `<tr data-p="${p.id}"><th>${esc(p.name)}</th>` + S.modules.map(m => `<td><input type="checkbox" data-m="${m.id}" data-orig="${p.modules.includes(m.id) ? 1 : 0}" ${p.modules.includes(m.id) ? 'checked' : ''} aria-label="${esc(p.name)} / ${esc(m.name)}"></td>`).join('') + '</tr>';
  h += '</tbody></table></div>';
  if (!S.modules.length) h += '<div class="muted">אין תתי מודולים. הוסף דרך "תת מודולים".</div>';
  h += `<div class="err" id="amerr">${esc(err || '')}</div><div class="foot"><span></span><span><button data-close>סגור</button> <button class="primary" id="amsave">שמור שיוך</button></span></div>`;
  $('dAssignM').innerHTML = h;
}
$('dAssignM').addEventListener('click', async e => {
  const d = $('dAssignM');
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'amsave') {
      const changed = [];
      d.querySelectorAll('tbody tr').forEach(tr => {
        const boxes = [...tr.querySelectorAll('input[type=checkbox]')];
        if (boxes.some(b => (b.checked ? 1 : 0) !== +b.dataset.orig)) changed.push({id:tr.dataset.p, modules:boxes.filter(b => b.checked).map(b => b.dataset.m), removed:boxes.filter(b => !b.checked && +b.dataset.orig).length});
      });
      const removed = changed.reduce((n, c) => n + c.removed, 0);
      if (removed && e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = `יימחקו ${removed} תאים. לחץ שוב לאישור`; return; }
      for (const c of changed) await api('/api/project/update', {id:c.id, modules:c.modules});
      d.close();
    }
  } catch (er) { renderAssignModules(er.message); }
});

$('assignEmps').onclick = () => { renderAssignEmps(); $('dAssignE').showModal(); };
function renderAssignEmps(err) {
  let h = '<h2>שיוך עובדים לפרויקטים</h2><div class="muted">בחר לכל פרויקט את האחראי בכל תפקיד. הבחירה חלה על כל המשימות של הפרויקט. אפשר לשנות משימה בודדת בחלון התא. העובדים עצמם מנוהלים במסך "עובדים".</div>';
  h += '<div class="scroll"><table class="grid"><thead><tr><th></th>' + S.roles.map(r => `<th>${esc(r.name)}</th>`).join('') + '</tr></thead><tbody>';
  for (const p of S.projects) {
    h += `<tr data-p="${p.id}"><th>${esc(p.name)}</th>`;
    for (const r of S.roles) {
      const list = S.employees.filter(e => e.role === r.key).concat(S.employees.filter(e => e.role !== r.key));
      h += `<td><select data-role="${r.key}" data-orig="${esc(p.owners[r.key] || '')}"><option value="">ללא</option>${list.map(e => `<option value="${esc(e.name)}" ${e.name === p.owners[r.key] ? 'selected' : ''}>${esc(e.name)}${e.role !== r.key ? ' (' + esc(roleName(e.role)) + ')' : ''}</option>`).join('')}</select></td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if (!S.employees.length) h += '<div class="muted">אין עובדים. הוסף דרך "עובדים".</div>';
  h += `<div class="err" id="aeerr">${esc(err || '')}</div><div class="foot"><span></span><span><button data-close>סגור</button> <button class="primary" id="aesave">שמור שיוך</button></span></div>`;
  $('dAssignE').innerHTML = h;
}
$('dAssignE').addEventListener('click', async e => {
  const d = $('dAssignE');
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'aesave') {
      // only roles that were changed are sent, so untouched per-task assignments stay as they are
      for (const tr of d.querySelectorAll('tbody tr')) {
        const owners = {};
        tr.querySelectorAll('select[data-role]').forEach(s => { if (s.value !== s.dataset.orig) owners[s.dataset.role] = s.value; });
        if (Object.keys(owners).length) await api('/api/project/update', {id:tr.dataset.p, owners});
      }
      d.close();
    }
  } catch (er) { renderAssignEmps(er.message); }
});

/* ---------- module management ---------- */
$('manageModules').onclick = () => { renderModules(); $('dModules').showModal(); };
function renderModules(err) {
  let h = '<h2>תת מודולים</h2><div class="muted">שינוי שם מתעדכן בכל הפרויקטים. מחיקה מסירה את התת מודול מכל הפרויקטים.</div>';
  for (const m of S.modules) h += `<div class="row" data-id="${m.id}"><input type="text" value="${esc(m.name)}"><button data-save>שמור</button><button class="danger" data-del>מחק</button></div>`;
  h += `<label for="nm">תת מודול חדש</label><div class="row"><input type="text" id="nm" placeholder="שם"><button class="primary" id="madd">הוסף</button></div>`;
  h += `<div class="err" id="merr">${esc(err||'')}</div><div class="foot"><span></span><button data-close>סגור</button></div>`;
  $('dModules').innerHTML = h;
}
$('dModules').addEventListener('click', async e => {
  const d = $('dModules'), row = e.target.closest('.row[data-id]');
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'madd') { const n = $('nm').value.trim(); if (!n) return; await api('/api/module', {name:n}); renderModules(); }
    else if (row && e.target.matches('[data-save]')) { await api('/api/module/update', {id:row.dataset.id, name:row.querySelector('input').value}); renderModules(); }
    else if (row && e.target.matches('[data-del]')) {
      if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'בטוח?'; return; }
      await api('/api/module/delete', {id:row.dataset.id}); renderModules();
    }
  } catch (er) { renderModules(er.message); }
});

/* ---------- employees ---------- */
const roleOptions = sel => S.roles.map(r => `<option value="${r.key}" ${r.key === sel ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
function renderEmps(err, keep) {
  let h = '<h2>עובדים</h2><div class="muted">כל משימה בזרם משויכת לעובד. העובד מזוהה לפי השם, ושינוי שם מתעדכן בכל המשימות. כמה עובדים יכולים לשתף אותה כתובת מייל. מחיקת עובד מסירה אותו מכל המשימות.</div>';
  if (!S.employees.length) h += '<div class="muted" style="margin-top:10px">עדיין אין עובדים. הוסף למטה.</div>';
  for (const e of S.employees)
    h += `<div class="row emp" data-key="${esc(e.name)}"><input type="text" class="en" value="${esc(e.name)}" aria-label="שם"><input type="text" class="ee" value="${esc(e.email)}" dir="ltr" aria-label="אימייל"><select class="er" aria-label="תפקיד">${roleOptions(e.role)}</select><button data-save>שמור</button><button class="danger" data-del>מחק</button></div>`;
  h += `<label>עובד חדש</label><div class="row"><input type="text" id="enm" placeholder="שם" value="${esc(keep?.name || '')}"><input type="text" id="eem" placeholder="name@company.com" dir="ltr" value="${esc(keep?.email || '')}"><select id="erl">${roleOptions(keep?.role)}</select><button class="primary" id="eadd">הוסף</button></div>`;
  h += `<div class="err" id="emerr">${esc(err || '')}</div><div class="foot"><span></span><button data-close>סגור</button></div>`;
  $('dEmps').innerHTML = h;
}
$('dEmps').addEventListener('click', async e => {
  const d = $('dEmps'), row = e.target.closest('.row.emp');
  try {
    if (e.target.closest('[data-close]')) return d.close();
    if (e.target.id === 'eadd') {
      const draft = {name:$('enm').value.trim(), email:$('eem').value.trim(), role:$('erl').value};
      try { await api('/api/employee', draft); renderEmps(); } catch (er) { renderEmps(er.message, draft); }
    } else if (row && e.target.matches('[data-save]')) {
      await api('/api/employee/update', {key:row.dataset.key, name:row.querySelector('.en').value.trim(), email:row.querySelector('.ee').value.trim(), role:row.querySelector('.er').value});
      renderEmps();
    } else if (row && e.target.matches('[data-del]')) {
      if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'בטוח?'; return; }
      await api('/api/employee/delete', {key:row.dataset.key}); renderEmps();
    }
  } catch (er) { renderEmps(er.message); }
});

refresh(true); setInterval(refresh, 2000);
</script>
</body>
</html>
